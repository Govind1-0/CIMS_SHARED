<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <title>CIMS — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --admin-dark:   #030310;
      --admin-mid:    #16213e;
      --admin-accent: #fefcfa;
      --hotel-dark:   #000201;
      --hotel-mid:    #0c3323fe;
      --hotel-accent: #f5f7f6;
      --white:        #ffffff;
      --off-white:    #f4f4f8;
      --muted:        rgba(255,255,255,.55);
      --border:       rgba(255,255,255,.12);
      --error-bg:     rgba(220,53,69,.15);
      --error-text:   #ff8a93;
      --radius:       14px;
      --transition:   .25s cubic-bezier(.4,0,.2,1);
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--admin-dark);
      color: var(--white);
      min-height: 100dvh;
      transition: background var(--transition);
    }

    body.hotel-mode {
      background: var(--hotel-dark);
    }

    .bg-pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-pattern::before {
      content: "";
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(226,185,111,.08) 0%, transparent 70%);
      top: -200px; right: -200px;
      transition: background var(--transition);
    }
    body.hotel-mode .bg-pattern::before {
      background: radial-gradient(circle, rgba(126,220,180,.08) 0%, transparent 70%);
    }
    .bg-pattern::after {
      content: "";
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(226,185,111,.05) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      transition: background var(--transition);
    }
    body.hotel-mode .bg-pattern::after {
      background: radial-gradient(circle, rgba(126,220,180,.05) 0%, transparent 70%);
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px 16px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px; height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--admin-accent), rgba(255, 255, 254, 0.4));
      font-size: 26px;
      margin-bottom: 12px;
      transition: background var(--transition);
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    body.hotel-mode .logo-mark {
      background: linear-gradient(135deg, var(--hotel-accent), rgba(252, 255, 254, 0.4));
    }
    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.3px;
    }
    .logo p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    .role-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
      width: 100%;
    }
    .role-btn {
      padding: 10px 8px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .role-btn.active {
      background: rgba(255,255,255,.12);
      color: var(--white);
      font-weight: 600;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .card-header {
      margin-bottom: 24px;
    }
    .card-header h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-header p {
      font-size: 13px;
      color: var(--muted);
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,.07);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--white);
      font-size: 15px;
      outline: none;
      transition: border-color var(--transition), background var(--transition);
    }
    input::placeholder { color: rgba(255,255,255,.25); }
    input:focus {
      border-color: var(--admin-accent);
      background: rgba(255,255,255,.1);
    }
    body.hotel-mode input:focus {
      border-color: var(--hotel-accent);
    }

    .pw-wrap {
      position: relative;
    }
    .pw-wrap input { padding-right: 48px; }
    .pw-toggle {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 17px;
      padding: 4px;
      line-height: 1;
    }

    .error-msg {
      display: none;
      background: var(--error-bg);
      border: 1px solid rgba(220,53,69,.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error-text);
      margin-bottom: 16px;
    }
    .error-msg.visible { display: flex; align-items: center; gap: 8px; }

    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--admin-accent), #ffffff);
      color: #1a1a2e;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
      margin-top: 4px;
    }
    body.hotel-mode .btn-login {
      background: linear-gradient(135deg, var(--hotel-accent), #f4f7f6);
      color: #0f3d30;
    }
    .btn-login:hover   { opacity: .9; }
    .btn-login:active  { transform: scale(.97); }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: #1a1a2e;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.15);
      color: var(--admin-accent);
      border: 1px solid rgba(226,185,111,.25);
      transition: all var(--transition);
    }
    body.hotel-mode .role-badge {
      background: rgba(247, 248, 247, 0.15);
      color: var(--hotel-accent);
      border-color: rgba(126,220,180,.25);
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 20px;
    }

    .redirect-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    .redirect-overlay.visible { display: flex; }
    .redirect-overlay p {
      font-size: 16px;
      font-weight: 500;
      color: var(--white);
    }
    .redirect-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: var(--admin-accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    body.hotel-mode .redirect-spinner {
      border-top-color: var(--hotel-accent);
    }

    @media (min-width: 480px) {
      .card { padding: 36px 32px; }
    }
  </style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="redirect-overlay" id="redirect-overlay">
  <div class="redirect-spinner"></div>
  <p id="redirect-msg">Signing you in...</p>
</div>

<main>
  <div style="width:100%;max-width:400px">

    <div class="logo">
      <h1>CIMS</h1>
      <p>Collaborative Inventory Management</p>
    </div>


    <div class="role-toggle">
      <button class="role-btn active" id="btn-admin" onclick="switchRole('admin')">
          Admin
      </button>
      <button class="role-btn" id="btn-hotel" onclick="switchRole('hotel')">
         Hotel Staff
      </button>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="role-badge" id="role-badge"> &nbsp;Admin login</div>
        <h2 id="card-title" style="margin-top:12px">Welcome back</h2>
        <p id="card-sub">Sign in to your admin dashboard</p>
      </div>

      <div class="error-msg" id="error-msg">
        <span>⚠️</span>
        <span id="error-text">Invalid email or password.</span>
      </div>

      <div class="field">
        <label>Email address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          inputmode="email"
        />
      </div>

      <div class="field">
        <label>Password</label>
        <div class="pw-wrap">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button class="pw-toggle" onclick="togglePassword()" type="button" aria-label="Show password">
            👁
          </button>
        </div>
      </div>

      <button class="btn-login" id="btn-login" onclick="handleLogin()">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">Sign in</span>
      </button>

      <div class="divider"></div>

      <p style="font-size:12px;color:rgba(255,255,255,.35);text-align:center">
        Forgot your password? Contact your system administrator.
      </p>
    </div>

    <p class="footer-note">CIMS · Secure login</p>
  </div>
</main>

<script>
  const API   = "https://cims-backends.onrender.com/api/auth";
  let   role  = "admin";

  function switchRole(newRole) {
    role = newRole;
    const isHotel = role === "hotel";

    document.body.classList.toggle("hotel-mode", isHotel);
    document.getElementById("btn-admin").classList.toggle("active", !isHotel);
    document.getElementById("btn-hotel").classList.toggle("active",  isHotel);

    document.getElementById("role-badge").innerHTML  = isHotel ? " &nbsp;Hotel staff login" : " &nbsp;Admin login";
    document.getElementById("card-title").textContent = "Welcome back";
    document.getElementById("card-sub").textContent   = isHotel
      ? "Sign in to your hotel dashboard"
      : "Sign in to your admin dashboard";

    hideError();
    document.getElementById("email").value    = "";
    document.getElementById("password").value = "";
    document.getElementById("email").focus();
  }

  function togglePassword() {
    const inp = document.getElementById("password");
    inp.type  = inp.type === "password" ? "text" : "password";
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Enter") handleLogin();
  });

  async function handleLogin() {
    const email    = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email)    return showError("Please enter your email address.");
    if (!password) return showError("Please enter your password.");

    setLoading(true);
    hideError();

    try {
      const res  = await fetch(`${API}/login`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ email, password, role }),
      });
      const data = await res.json();

      if (!data.success) {
        setLoading(false);
        return showError(data.message || "Invalid email or password.");
      }

      localStorage.setItem("cims_token", data.token);
      localStorage.setItem("cims_user",  JSON.stringify(data.user));
      localStorage.setItem("cims_role",  data.user.role);

      const overlay = document.getElementById("redirect-overlay");
      const msg     = document.getElementById("redirect-msg");
      overlay.classList.add("visible");
      msg.textContent = data.user.role === "admin"
        ? "Taking you to admin dashboard..."
        : `Welcome, ${data.user.name}! Loading your hotel dashboard...`;

      setTimeout(() => {
        window.location.href = data.user.role === "admin"
          ? "admin.html"
          : "hotel.html";
      }, 1200);

    } catch {
      setLoading(false);
      showError("Cannot connect to server. Is the backend running?");
    }
  }

  function setLoading(loading) {
    document.getElementById("btn-login").disabled   = loading;
    document.getElementById("spinner").classList.toggle("visible", loading);
    document.getElementById("btn-text").textContent = loading ? "Signing in..." : "Sign in";
  }

  function showError(msg) {
    const el  = document.getElementById("error-msg");
    document.getElementById("error-text").textContent = msg;
    el.classList.add("visible");
  }

  function hideError() {
    document.getElementById("error-msg").classList.remove("visible");
  }

  window.addEventListener("load", () => {
    const token = localStorage.getItem("cims_token");
    const role  = localStorage.getItem("cims_role");
    if (token && role) {
      window.location.href = role === "admin"
        ? "admin.html"
        : "hotel.html";
    }
    document.getElementById("email").focus();
  });
</script>
<script src="sanitize.js"></script>
</body>
</html>
